name: Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          test "$TAG" = "$VER" || { echo "tag $TAG != package version $VER"; exit 1; }
      - run: npm test
      - run: npm run build
      - run: cd dist && zip -r "../numenumd-${GITHUB_REF_NAME}.zip" .
      - name: Verify manifest.json is at the zip root
        run: unzip -Z1 "numenumd-${GITHUB_REF_NAME}.zip" | grep -qx 'manifest.json'
      - uses: actions/upload-artifact@v4
        with: { name: extension-zip, path: 'numenumd-*.zip' }
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: extension-zip }
      - name: Create GitHub Release with the extension zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "numenumd-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
